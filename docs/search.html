<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Log Search — OE8YML</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#f1f5f9;padding:0.75rem;font-size:0.85rem}
.search-row{display:flex;gap:8px;margin-bottom:0.6rem}
input{flex:1;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:8px 12px;color:#f1f5f9;font-size:0.85rem;outline:none}
input:focus{border-color:#3b82f6}
button{background:#3b82f6;border:none;border-radius:8px;padding:8px 16px;color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
#status{color:#64748b;font-size:0.7rem;margin-bottom:0.5rem;min-height:1rem}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.3rem .6rem;color:#64748b;font-size:.68rem;font-weight:500;border-bottom:1px solid #334155;text-transform:uppercase;letter-spacing:.05em}
td{padding:.35rem .6rem;font-size:.82rem;border-bottom:1px solid #1a2744}
td:first-child{color:#e2e8f0;font-weight:700;font-family:'Courier New',monospace}
td:not(:first-child){color:#94a3b8}
tr:hover td{background:#1e293b}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;overflow:hidden}
.card-head{padding:.35rem .6rem;background:#1a2744;font-size:.68rem;font-weight:600;color:#94a3b8;letter-spacing:.05em;text-transform:uppercase}
</style>
</head>
<body>
<div class="search-row">
  <input id="q" type="text" placeholder="Callsign suchen..." autocomplete="off" spellcheck="false">
  <button onclick="doSearch()">Suchen</button>
</div>
<div id="status"></div>
<div id="results"></div>

<script>
var idx=null;
var statusEl=document.getElementById('status');
var resultsEl=document.getElementById('results');

function loadIndex(cb){
  if(idx){cb();return;}
  statusEl.textContent='Lade Index...';
  fetch('wavelog-index.json')
    .then(function(r){return r.json();})
    .then(function(d){
      idx=d;
      statusEl.textContent=idx.t.toLocaleString()+' QSOs \u2014 '+Object.keys(idx.q).length.toLocaleString()+' Calls \u2014 '+idx.u;
      cb();
    })
    .catch(function(){statusEl.textContent='Fehler beim Laden.';});
}

function doSearch(){
  var q=document.getElementById('q').value.trim().toUpperCase();
  if(!q)return;
  loadIndex(function(){showResults(q);});
}

function showResults(q){
  if(!idx)return;
  var keys=Object.keys(idx.q).filter(function(k){return k.includes(q);}).sort();
  if(!keys.length){
    resultsEl.innerHTML='<p style="color:#64748b;padding:.4rem">Kein QSO mit <strong style="color:#f1f5f9">'+q+'</strong> gefunden.</p>';
    return;
  }
  var rows='';
  keys.forEach(function(call){
    idx.q[call].forEach(function(e){
      var d=e[0];
      var date=d.slice(6,8)+'.'+d.slice(4,6)+'.'+d.slice(2,4);
      rows+='<tr><td>'+call+'</td><td>'+date+'</td><td>'+e[1]+'</td><td>'+e[2]+'</td></tr>';
    });
  });
  var lbl=keys.length===1?'1 Callsign':keys.length+' Callsigns';
  resultsEl.innerHTML='<div class="card"><div class="card-head">'+lbl+' f&uuml;r '+q+'</div>'
    +'<table><thead><tr><th>Call</th><th>Datum</th><th>Band</th><th>Mode</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

var params=new URLSearchParams(window.location.search);
var cp=params.get('call');
if(cp){
  document.getElementById('q').value=cp.toUpperCase();
  loadIndex(function(){showResults(cp.toUpperCase());});
}

document.getElementById('q').addEventListener('keydown',function(e){if(e.key==='Enter')doSearch();});
</script>
</body>
</html>
