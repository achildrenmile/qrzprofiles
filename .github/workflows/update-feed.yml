name: Update OERadio Feed Widget

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate feed widget HTML
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import html
          import re
          from datetime import datetime

          RSS_URL = "https://oeradio.at/en/feed/"
          MAX_ITEMS = 6

          try:
              req = urllib.request.Request(RSS_URL, headers={"User-Agent": "Mozilla/5.0 OERadio-Feed-Bot"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  feed_data = resp.read().decode("utf-8")
          except Exception as e:
              print(f"Failed to fetch feed: {e}")
              exit(1)

          try:
              root = ET.fromstring(feed_data)
          except ET.ParseError as e:
              print(f"Failed to parse XML: {e}")
              exit(1)

          items = root.findall(".//item")[:MAX_ITEMS]
          if not items:
              print("No items found in feed")
              exit(1)

          parts = []
          parts.append('<!DOCTYPE html>')
          parts.append('<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head>')
          parts.append('<body style="margin:0;padding:1rem;font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#f1f5f9;font-size:0.9rem;line-height:1.6">')

          for i, item in enumerate(items):
              title_el = item.find("title")
              link_el = item.find("link")
              pubdate_el = item.find("pubDate")
              desc_el = item.find("description")

              title = html.escape(title_el.text or "") if title_el is not None else ""
              link = html.escape(link_el.text or "") if link_el is not None else ""

              date_str = ""
              if pubdate_el is not None and pubdate_el.text:
                  try:
                      dt = datetime.strptime(pubdate_el.text.strip(), "%a, %d %b %Y %H:%M:%S %z")
                      date_str = dt.strftime("%b %d, %Y")
                  except ValueError:
                      date_str = pubdate_el.text

              desc = ""
              if desc_el is not None and desc_el.text:
                  d = re.sub(r"<[^>]+>", "", desc_el.text)
                  d = html.unescape(d)
                  d = re.sub(r"\s+", " ", d).strip()
                  if len(d) > 150:
                      d = d[:150] + "..."
                  d = d.replace("&", "&#38;").replace('"', "&#34;").replace("'", "&#8217;").replace("<", "&lt;").replace(">", "&gt;")
                  d = d.replace("\u2013", "&#8211;").replace("\u2014", "&#8212;").replace("\u201c", "&#8220;").replace("\u201d", "&#8221;")
                  desc = d

              title_safe = title.replace("\u2013", "&#8211;").replace("\u2014", "&#8212;").replace("\\!", "!").replace("'", "&#8217;")

              border = "border-bottom:1px solid #334155;" if i < len(items) - 1 else ""

              parts.append(f'<div style="margin-bottom:1.5rem;padding-bottom:1.5rem;{border}">')
              parts.append(f'<div style="margin-bottom:0.5rem"><a href="{link}" target="_blank" style="color:#3b82f6;text-decoration:none;font-weight:600;font-size:0.95rem">{title_safe}</a></div>')
              parts.append(f'<div style="color:#64748b;font-size:0.75rem;margin-bottom:0.5rem">{date_str}</div>')
              parts.append(f'<div style="color:#94a3b8;font-size:0.85rem;line-height:1.5">{desc}</div>')
              parts.append('</div>')

          parts.append('</body></html>')

          with open("docs/feed-widget.html", "w", encoding="utf-8") as f:
              f.write("\n".join(parts))
          print(f"Generated docs/feed-widget.html with {len(items)} items")
          PYEOF

      - name: Generate Wavelog widget + search index
        env:
          WAVELOG_API_KEY: ${{ secrets.WAVELOG_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, re, os
          from datetime import datetime, timezone

          API_KEY   = os.environ.get("WAVELOG_API_KEY", "")
          BASE_URL  = "https://wavelog.oeradio.at/index.php/api"
          STATION_ID = 1

          def api_get(path):
              req = urllib.request.Request(f"{BASE_URL}/{path}", headers={"User-Agent": "QRZ-Widget-Bot"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          def api_post(path, data):
              body = json.dumps(data).encode()
              req = urllib.request.Request(f"{BASE_URL}/{path}", data=body,
                  headers={"Content-Type": "application/json", "User-Agent": "QRZ-Widget-Bot"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode())

          def adif_field(record, tag):
              m = re.search(rf'<{tag}:\d+>([^\r\n<]+)', record, re.IGNORECASE)
              return m.group(1).strip() if m else ""

          # Stats
          try:
              stats = api_get(f"statistics/{API_KEY}/{STATION_ID}")
          except Exception as e:
              print(f"Failed to fetch stats: {e}"); exit(1)

          total = int(stats.get("total_qsos", 0))
          today = int(stats.get("Today", 0))
          month = int(stats.get("month_qsos", 0))
          year  = int(stats.get("year_qsos", 0))

          # Fetch ALL QSOs for search index
          try:
              all_resp = api_post("get_contacts_adif", {
                  "key": API_KEY, "station_id": STATION_ID,
                  "fetchfromid": 0, "limit": 25000
              })
          except Exception as e:
              print(f"Failed to fetch all QSOs: {e}"); exit(1)

          all_adif  = all_resp.get("adif", "")
          all_qsos  = []
          index     = {}  # call -> [[date,band,mode], ...]
          dxcc_set  = set()

          for rec in all_adif.split("<EOR>"):
              call = adif_field(rec, "CALL")
              if not call:
                  continue
              date  = adif_field(rec, "QSO_DATE")
              band  = adif_field(rec, "BAND")
              mode  = adif_field(rec, "MODE")
              time  = adif_field(rec, "TIME_ON")
              dxcc  = adif_field(rec, "DXCC")
              rst_s = adif_field(rec, "RST_SENT")
              rst_r = adif_field(rec, "RST_RCVD")
              all_qsos.append({"call": call, "date": date, "time": time, "band": band, "mode": mode})
              cu = call.upper()
              if cu not in index:
                  index[cu] = []
              index[cu].append([date, band, mode, rst_s, rst_r])
              if dxcc:
                  dxcc_set.add(dxcc)

          # Sort each call's QSOs newest first
          for cu in index:
              index[cu].sort(key=lambda x: x[0], reverse=True)

          updated = datetime.now(timezone.utc).strftime("%d.%m.%Y %H:%MZ")

          # Write search index JSON
          idx_obj = {"u": updated, "t": total, "q": index}
          idx_json = json.dumps(idx_obj, separators=(',', ':'))
          with open("docs/wavelog-index.json", "w", encoding="utf-8") as f:
              f.write(idx_json)
          print(f"Generated docs/wavelog-index.json ({len(idx_json.encode()):,} bytes, {len(index):,} unique calls)")

          # Last 10 QSOs for widget display — sort by date+time first
          all_qsos.sort(key=lambda x: x['date'] + x['time'])
          recent = list(reversed(all_qsos[-10:]))

          # Write stats JSON (for PHP logsearch page header)
          stats_obj = {
              "total": total,
              "dxcc": len(dxcc_set),
              "updated": updated,
              "recent": [{"c": q["call"], "d": q["date"], "t": q["time"], "b": q["band"], "m": q["mode"]} for q in recent]
          }
          stats_json = json.dumps(stats_obj, separators=(',', ':'))
          with open("docs/wavelog-stats.json", "w", encoding="utf-8") as f:
              f.write(stats_json)
          print(f"Generated docs/wavelog-stats.json (total={total}, dxcc={len(dxcc_set)})")

          def fmt_date(d):
              try: return datetime.strptime(d, "%Y%m%d").strftime("%d.%m.%y")
              except: return d

          def fmt_time(t):
              return f"{t[:2]}:{t[2:4]}" if len(t) >= 4 else t

          # Build widget HTML
          p = []
          p.append('<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head>')
          p.append('<body style="margin:0;padding:0.75rem;font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#f1f5f9;font-size:0.85rem;box-sizing:border-box">')

          # Stats
          p.append('<div style="display:flex;gap:0.5rem;margin-bottom:0.75rem">')
          yr = datetime.now(timezone.utc).year
          for label, val in [("QSOs total", f"{total:,}"), (str(yr), str(year)), ("Monat", str(month)), ("Heute", str(today))]:
              p.append(f'<div style="flex:1;background:#1e293b;border-radius:8px;padding:0.5rem;text-align:center"><div style="font-size:1.1rem;font-weight:700;color:#3b82f6">{val}</div><div style="font-size:0.7rem;color:#64748b;margin-top:2px">{label}</div></div>')
          p.append('</div>')

          # Recent QSOs table
          p.append('<div style="background:#1e293b;border-radius:8px;overflow:hidden">')
          p.append('<div style="padding:0.4rem 0.75rem;background:#1a2744;font-size:0.7rem;font-weight:600;color:#94a3b8;letter-spacing:0.05em;text-transform:uppercase">Letzte QSOs</div>')
          p.append('<table style="width:100%;border-collapse:collapse;font-size:0.78rem">')
          p.append('<tr style="color:#64748b;font-size:0.68rem"><th style="padding:0.3rem 0.5rem;text-align:left;font-weight:500">Datum</th><th style="padding:0.3rem 0.5rem;text-align:left;font-weight:500">UTC</th><th style="padding:0.3rem 0.5rem;text-align:left;font-weight:500">Call</th><th style="padding:0.3rem 0.5rem;text-align:left;font-weight:500">Band</th><th style="padding:0.3rem 0.5rem;text-align:left;font-weight:500">Mode</th></tr>')
          for i, q in enumerate(recent):
              bg = "background:#172032;" if i % 2 == 0 else ""
              p.append(f'<tr style="{bg}"><td style="padding:0.3rem 0.5rem;color:#94a3b8">{fmt_date(q["date"])}</td><td style="padding:0.3rem 0.5rem;color:#64748b">{fmt_time(q["time"])}</td><td style="padding:0.3rem 0.5rem;color:#e2e8f0;font-weight:600">{q["call"]}</td><td style="padding:0.3rem 0.5rem;color:#94a3b8">{q["band"]}</td><td style="padding:0.3rem 0.5rem;color:#94a3b8">{q["mode"]}</td></tr>')
          p.append('</table></div>')

          p.append(f'<div style="text-align:right;color:#334155;font-size:0.65rem;margin-top:0.4rem">aktualisiert {updated} &bull; <a href="https://wavelog.oeradio.at" target="_blank" style="color:#334155">Wavelog</a></div>')

          p.append('</body></html>')

          out = "\n".join(p)
          with open("docs/wavelog-widget.html", "w", encoding="utf-8") as f:
              f.write(out)
          print(f"Generated docs/wavelog-widget.html ({len(out.encode()):,} bytes)")
          PYEOF

      - name: Generate OE8JOTA search index
        env:
          WAVELOG_API_KEY: ${{ secrets.WAVELOG_API_KEY_JOTA }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, re, os
          from datetime import datetime, timezone

          API_KEY    = os.environ.get("WAVELOG_API_KEY", "")
          BASE_URL   = "https://wavelog.oeradio.at/index.php/api"
          STATION_ID = 12

          def api_get(path):
              req = urllib.request.Request(f"{BASE_URL}/{path}", headers={"User-Agent": "QRZ-Widget-Bot"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          def api_post(path, data):
              body = json.dumps(data).encode()
              req = urllib.request.Request(f"{BASE_URL}/{path}", data=body,
                  headers={"Content-Type": "application/json", "User-Agent": "QRZ-Widget-Bot"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode())

          def adif_field(record, tag):
              m = re.search(rf'<{tag}:\d+>([^\r\n<]+)', record, re.IGNORECASE)
              return m.group(1).strip() if m else ""

          try:
              stats = api_get(f"statistics/{API_KEY}/{STATION_ID}")
          except Exception as e:
              print(f"Failed to fetch OE8JOTA stats: {e}"); exit(1)

          total = int(stats.get("total_qsos", 0))

          try:
              all_resp = api_post("get_contacts_adif", {
                  "key": API_KEY, "station_id": STATION_ID,
                  "fetchfromid": 0, "limit": 25000
              })
          except Exception as e:
              print(f"Failed to fetch OE8JOTA QSOs: {e}"); exit(1)

          all_adif = all_resp.get("adif", "")
          all_qsos = []
          index    = {}
          dxcc_set = set()

          for rec in all_adif.split("<EOR>"):
              call = adif_field(rec, "CALL")
              if not call: continue
              date  = adif_field(rec, "QSO_DATE")
              band  = adif_field(rec, "BAND")
              mode  = adif_field(rec, "MODE")
              time  = adif_field(rec, "TIME_ON")
              dxcc  = adif_field(rec, "DXCC")
              rst_s = adif_field(rec, "RST_SENT")
              rst_r = adif_field(rec, "RST_RCVD")
              all_qsos.append({"call": call, "date": date, "time": time, "band": band, "mode": mode})
              cu = call.upper()
              if cu not in index: index[cu] = []
              index[cu].append([date, band, mode, rst_s, rst_r])
              if dxcc: dxcc_set.add(dxcc)

          for cu in index:
              index[cu].sort(key=lambda x: x[0], reverse=True)

          updated = datetime.now(timezone.utc).strftime("%d.%m.%Y %H:%MZ")

          idx_obj  = {"u": updated, "t": total, "q": index}
          idx_json = json.dumps(idx_obj, separators=(',', ':'))
          with open("docs/wavelog-index-oe8jota.json", "w", encoding="utf-8") as f:
              f.write(idx_json)

          all_qsos.sort(key=lambda x: x['date'] + x['time'])
          recent = list(reversed(all_qsos[-10:]))

          stats_obj  = {"total": total, "dxcc": len(dxcc_set), "updated": updated,
              "recent": [{"c": q["call"], "d": q["date"], "t": q["time"], "b": q["band"], "m": q["mode"]} for q in recent]}
          stats_json = json.dumps(stats_obj, separators=(',', ':'))
          with open("docs/wavelog-stats-oe8jota.json", "w", encoding="utf-8") as f:
              f.write(stats_json)

          print(f"Generated OE8JOTA index ({len(index):,} unique calls, total={total}, dxcc={len(dxcc_set)})")
          PYEOF

      - name: Extract signature from QSL card
        run: |
          pip install Pillow --quiet
          python3 << 'PYEOF'
          import os
          from PIL import Image

          raw_path = "docs/oe8yml-sig-raw.png"
          sig_path = "docs/oe8yml-sig.png"
          if not os.path.exists(raw_path):
              print("No raw signature found, skipping"); exit(0)

          sig = Image.open(raw_path).convert("RGBA")
          pixels = sig.load()
          sw, sh = sig.size
          # Make light/grey background transparent, keep red signature
          for py in range(sh):
              for px in range(sw):
                  r, g, b, a = pixels[px, py]
                  brightness = (r + g + b) / 3
                  if brightness > 200:
                      pixels[px, py] = (r, g, b, 0)

          sig.save(sig_path, "PNG")
          print(f"Signature processed: {sw}x{sh}px -> {sig_path}")
          PYEOF

      - name: Generate QSO map
        run: |
          pip install matplotlib cartopy --quiet
          python3 << 'PYEOF'
          import json, re, math, os
          import matplotlib
          matplotlib.use('Agg')
          import matplotlib.pyplot as plt
          import matplotlib.patches as mpatches
          import cartopy.crs as ccrs
          import cartopy.feature as cfeature

          def adif_field(record, tag):
              m = re.search(rf'<{tag}:\d+>([^\r\n<]+)', record, re.IGNORECASE)
              return m.group(1).strip() if m else ""

          def grid_to_latlon(grid):
              grid = grid.upper().strip()
              if len(grid) < 4:
                  return None, None
              try:
                  lon = (ord(grid[0]) - ord('A')) * 20 - 180
                  lat = (ord(grid[1]) - ord('A')) * 10 - 90
                  lon += int(grid[2]) * 2
                  lat += int(grid[3]) * 1
                  if len(grid) >= 6:
                      lon += (ord(grid[4]) - ord('A') + 0.5) * 2 / 24
                      lat += (ord(grid[5]) - ord('A') + 0.5) / 24
                  else:
                      lon += 1.0
                      lat += 0.5
                  return lat, lon
              except Exception:
                  return None, None

          # Read ADIF produced by earlier step (re-use already-fetched data via index)
          # We need gridsquares — fetch fresh ADIF
          import urllib.request
          import os

          API_KEY    = os.environ.get("WAVELOG_API_KEY", "")
          BASE_URL   = "https://wavelog.oeradio.at/index.php/api"
          STATION_ID = 1

          body = json.dumps({"key": API_KEY, "station_id": STATION_ID,
                             "fetchfromid": 0, "limit": 25000}).encode()
          req = urllib.request.Request(f"{BASE_URL}/get_contacts_adif", data=body,
              headers={"Content-Type": "application/json", "User-Agent": "QSO-Map-Bot"})
          with urllib.request.urlopen(req, timeout=60) as r:
              adif = json.loads(r.read()).get("adif", "")

          lats, lons = [], []
          seen = set()
          for rec in adif.split("<EOR>"):
              grid = adif_field(rec, "GRIDSQUARE")
              if not grid or grid in seen:
                  continue
              seen.add(grid)
              lat, lon = grid_to_latlon(grid)
              if lat is not None and -90 <= lat <= 90 and -180 <= lon <= 180:
                  lats.append(lat)
                  lons.append(lon)

          print(f"Plotting {len(lats)} unique gridsquare locations")

          # OE8YML home: JN66TO
          home_lat, home_lon = grid_to_latlon("JN66TO")

          fig = plt.figure(figsize=(14, 7), facecolor='#050d1a')
          ax = fig.add_subplot(1, 1, 1, projection=ccrs.PlateCarree())
          ax.set_global()
          ax.set_facecolor('#050d1a')

          ax.add_feature(cfeature.OCEAN.with_scale('110m'), facecolor='#050d1a', zorder=0)
          ax.add_feature(cfeature.LAND.with_scale('110m'),  facecolor='#0f2336', zorder=1)
          ax.add_feature(cfeature.COASTLINE.with_scale('110m'), edgecolor='#2a5a8a', linewidth=0.6, zorder=2)
          ax.add_feature(cfeature.LAKES.with_scale('110m'),  facecolor='#050d1a', zorder=2)

          # QSO partner dots — glow effect with layered scatter
          kw = dict(transform=ccrs.PlateCarree(), linewidths=0)
          ax.scatter(lons, lats, s=40,  c='#38bdf8', alpha=0.04, zorder=3, **kw)
          ax.scatter(lons, lats, s=12,  c='#38bdf8', alpha=0.15, zorder=4, **kw)
          ax.scatter(lons, lats, s=4,   c='#7dd3fc', alpha=0.70, zorder=5, **kw)

          # Home dot — amber with ring
          ax.scatter([home_lon], [home_lat], s=220, c='#f59e0b', alpha=0.20,
                     transform=ccrs.PlateCarree(), zorder=6, linewidths=0)
          ax.scatter([home_lon], [home_lat], s=70,  c='#fbbf24',
                     transform=ccrs.PlateCarree(), zorder=7, linewidths=0)

          ax.spines['geo'].set_visible(False)
          plt.subplots_adjust(left=0, right=1, top=1, bottom=0)
          plt.savefig('docs/qso-map.png', dpi=140, bbox_inches='tight',
                      facecolor='#050d1a', pad_inches=0.04)
          plt.close()
          print(f"Generated docs/qso-map.png")
          PYEOF
        env:
          WAVELOG_API_KEY: ${{ secrets.WAVELOG_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed-widget.html docs/wavelog-widget.html docs/wavelog-index.json docs/wavelog-stats.json docs/wavelog-index-oe8jota.json docs/wavelog-stats-oe8jota.json docs/qso-map.png docs/oe8yml-sig.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update feed + Wavelog widgets"
            git pull --rebase
            git push
          fi
